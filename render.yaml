databases:
  - name: lexi-db
    plan: free
    databaseName: lexi
    user: lexi

services:
  - type: web
    name: lexi
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: LEXI_TIMEZONE
        value: Asia/Bishkek
      - key: DATABASE_URL
        fromDatabase:
          name: lexi-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: LEXI_COOKIE_SECURE
        value: "1"
      - key: LEXI_TRUST_PROXY
        value: "1"
